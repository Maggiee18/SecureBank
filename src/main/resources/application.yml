spring:
  application:
    name: securebank-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/securebank}
    username: ${DB_USERNAME:securebank}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

banking:
  business-zone: ${BUSINESS_ZONE:Asia/Kolkata}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:PT30M}
      issuer: securebank-api
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-duration: ${LOGIN_LOCK_DURATION:PT15M}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: Bank Operations Admin
    phone: "9000000000"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          # Not ready to take traffic if the database is unreachable.
          include: readinessState,db
  info:
    env:
      enabled: true

info:
  app:
    name: SecureBank API
    description: Secure digital banking REST API
    version: "@project.version@"

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}] [customerId=%X{customerId:-}]"
  level:
    com.securebank: INFO
    org.hibernate.SQL: WARN
